version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directories:
      - /daemon
      - /lib/runtimeapi
      - /tooling/protogen
    schedule:
      interval: weekly
    groups:
      protobuf:
        group-by: dependency-name
        patterns:
          - google.golang.org/protobuf
  - package-ecosystem: cargo
    directory: /guest-agent
    schedule:
      interval: weekly
  - package-ecosystem: rust-toolchain
    directory: /guest-agent
    schedule:
      interval: weekly
