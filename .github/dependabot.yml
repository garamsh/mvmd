version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directories:
      - /daemon
      - /e2e
      - /lib/runtimeapi
      - /tooling/protogen
    schedule:
      interval: weekly
    groups:
      protobuf:
        group-by: dependency-name
        patterns:
          - google.golang.org/protobuf
  - package-ecosystem: cargo
    directories:
      - /guest-agent
      - /imageconv
      - /lib/initrd
    schedule:
      interval: weekly
  - package-ecosystem: rust-toolchain
    directories:
      - /guest-agent
      - /imageconv
      - /lib/initrd
    schedule:
      interval: weekly
