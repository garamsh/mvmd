name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            lib/runtimeapi/go.sum
            tooling/protogen/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rust-src-dir: guest-agent
          cache: false
          build-warnings: ""
      - name: Build the agent and the test binary
        run: |
          nproc
          (cd guest-agent && cargo build --locked -p guest-agent --bin guest-agent-channel)
          (cd daemon && go test -c -o "$RUNNER_TEMP/gc.test" ./internal/guestchannel/)
      - name: Measure the rate
        run: |
          export GUEST_AGENT_CHANNEL="$PWD/guest-agent/target/debug/guest-agent-channel"
          N=20
          run_all() {
            f=0
            for i in $(seq 1 "$N"); do
              if ! out=$("$RUNNER_TEMP/gc.test" -test.count=1 -test.run 'TestRealAgent_StatusesMapToThePortsErrors$/ExecOutputGone' 2>&1); then
                f=$((f+1))
                echo "$out" | grep -m1 -E "no longer held|Messages:|Error:" || true
              fi
            done
            echo "$1: $f failures out of $N"
          }
          run_all unloaded
          for i in $(seq 1 12); do yes > /dev/null & done
          run_all loaded-12-hogs
          kill $(jobs -p)
