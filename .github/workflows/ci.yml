name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  rate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            lib/runtimeapi/go.sum
            tooling/protogen/go.sum
      - name: Build the test binary and the binaries it starts
        run: |
          echo "runner image: $ImageOS $ImageVersion"; uname -r; go version; git rev-parse HEAD
          mkdir -p "$RUNNER_TEMP/bin"; chmod 755 "$RUNNER_TEMP" "$RUNNER_TEMP/bin"
          cd daemon
          go build -o "$RUNNER_TEMP/bin/mvmd-supervisor" ./cmd/mvmd-supervisor
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/bin/probe" ./internal/supervisor/testdata/probe
          go test -c -o "$RUNNER_TEMP/bin/supervision.test" ./internal/supervision/
      - name: Runs, unloaded
        run: |
          cd daemon/internal/supervision
          fail=0
          for i in $(seq 1000); do
            if ! sudo -n env MVMD_SUPERVISOR_BIN="$RUNNER_TEMP/bin/mvmd-supervisor" MVMD_PROBE_BIN="$RUNNER_TEMP/bin/probe" "$RUNNER_TEMP/bin/supervision.test" -test.run 'TestStart_AFailedStepFailsTheStartBeforeTheVMMRuns/a_tap_that_does_not_exist$' -test.count=1 >"$RUNNER_TEMP/out.txt" 2>&1; then
              fail=$((fail+1)); echo "::group::unloaded run $i FAILED"; cat "$RUNNER_TEMP/out.txt"; echo "::endgroup::"
            fi
          done
          echo "RATE unloaded: $fail / 1000"
      - name: Runs, 12 hogs
        run: |
          for i in $(seq 12); do yes > /dev/null & done
          cd daemon/internal/supervision
          fail=0
          for i in $(seq 1000); do
            if ! sudo -n env MVMD_SUPERVISOR_BIN="$RUNNER_TEMP/bin/mvmd-supervisor" MVMD_PROBE_BIN="$RUNNER_TEMP/bin/probe" "$RUNNER_TEMP/bin/supervision.test" -test.run 'TestStart_AFailedStepFailsTheStartBeforeTheVMMRuns/a_tap_that_does_not_exist$' -test.count=1 >"$RUNNER_TEMP/out.txt" 2>&1; then
              fail=$((fail+1)); echo "::group::loaded run $i FAILED"; cat "$RUNNER_TEMP/out.txt"; echo "::endgroup::"
            fi
          done
          echo "RATE 12 hogs: $fail / 1000"
          kill $(jobs -p) || true
