name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Count failures without load
        run: |
          cd daemon
          go test -c -o /tmp/sup.test ./internal/supervision/
          cd internal/supervision
          fails=0
          for i in $(seq 1 "$N"); do
            /tmp/sup.test -test.count=1 -test.run 'TestConfinement_TheSupervisorEndsAVMMThatWritesItsMatchToTheEventPipe$' >/tmp/out.$i 2>&1 || { fails=$((fails+1)); cat /tmp/out.$i | tail -20; }
          done
          echo "RATE unloaded: $fails failures out of $N"
        env:
          N: "20"
      - name: Count failures under CPU load
        run: |
          cd daemon/internal/supervision
          for i in $(seq 1 $(( $(nproc) * 3 ))); do (yes > /dev/null &) ; done
          fails=0
          for i in $(seq 1 "$N"); do
            /tmp/sup.test -test.count=1 -test.run 'TestConfinement_TheSupervisorEndsAVMMThatWritesItsMatchToTheEventPipe$' >/tmp/out.$i 2>&1 || { fails=$((fails+1)); tail -20 /tmp/out.$i; }
          done
          pkill yes || true
          echo "RATE loaded (yes hogs, 3 per CPU, nproc=$(nproc)): $fails failures out of $N"
        env:
          N: "20"
