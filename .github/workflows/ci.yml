name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            lib/runtimeapi/go.sum
            tooling/protogen/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rust-src-dir: guest-agent
          cache: false
          build-warnings: ""
      - name: Build the converter binary, the erofs tools and the test binary
        run: |
          nproc
          make erofs-utils
          (cd converter && cargo build --locked -p converter --bin converter-channel)
          (cd daemon && go test -c -o "$RUNNER_TEMP/cc.test" ./internal/convertchannel/)
      - name: Measure the rate
        run: |
          export CONVERTER_CHANNEL="$PWD/converter/target/debug/converter-channel"
          export MKFS_EROFS="$PWD/converter/target/erofs-utils/mkfs.erofs"
          export FSCK_EROFS="$PWD/converter/target/erofs-utils/fsck.erofs"
          N=1000
          run_all() {
            f=0
            for i in $(seq 1 "$N"); do
              if ! out=$("$RUNNER_TEMP/cc.test" -test.count=1 -test.run 'TestRealConverter_AFailureIsAStepError$' 2>&1); then
                f=$((f+1))
                echo "--- failure ---"; echo "$out"
              fi
            done
            echo "$1: $f failures out of $N"
          }
          run_all unloaded
          for i in $(seq 1 12); do yes > /dev/null & done
          run_all loaded-12-hogs
          kill $(jobs -p)
