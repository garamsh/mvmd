// The mvmd runtime API, version v1alpha2. Its meaning is fixed by
// docs/architecture/runtime-api.md; this file is the encoding.
syntax = "proto3";

package mvmd.runtime.v1alpha2;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/garamsh/mvmd/lib/runtimeapi/v1alpha2;v1alpha2";

// RuntimeService is the whole runtime API. Every call ends in an outcome kind
// (OutcomeKind). A success is an OK status; every other kind is a non-OK
// status whose details carry one Failure.
service RuntimeService {
  // Machine lifecycle.
  rpc CreateMachine(CreateMachineRequest) returns (CreateMachineResponse);
  rpc StartMachine(StartMachineRequest) returns (StartMachineResponse);
  rpc StopMachine(StopMachineRequest) returns (StopMachineResponse);
  rpc PauseMachine(PauseMachineRequest) returns (PauseMachineResponse);
  rpc ResumeMachine(ResumeMachineRequest) returns (ResumeMachineResponse);
  rpc SnapshotMachine(SnapshotMachineRequest) returns (SnapshotMachineResponse);
  rpc RestoreMachine(RestoreMachineRequest) returns (RestoreMachineResponse);
  rpc DeleteMachine(DeleteMachineRequest) returns (DeleteMachineResponse);

  // Disks and resources.
  rpc CreateDisk(CreateDiskRequest) returns (CreateDiskResponse);
  rpc ListDisks(ListDisksRequest) returns (ListDisksResponse);
  rpc ResizeDisk(ResizeDiskRequest) returns (ResizeDiskResponse);
  rpc SnapshotDisk(SnapshotDiskRequest) returns (SnapshotDiskResponse);
  rpc ListDiskSnapshots(ListDiskSnapshotsRequest) returns (ListDiskSnapshotsResponse);
  rpc DeleteDiskSnapshot(DeleteDiskSnapshotRequest) returns (DeleteDiskSnapshotResponse);
  rpc DeleteDisk(DeleteDiskRequest) returns (DeleteDiskResponse);
  rpc AttachDisk(AttachDiskRequest) returns (AttachDiskResponse);
  rpc DetachDisk(DetachDiskRequest) returns (DetachDiskResponse);
  rpc SetResources(SetResourcesRequest) returns (SetResourcesResponse);

  // Observation. These change nothing and can be repeated freely.
  rpc GetRuntimeInfo(GetRuntimeInfoRequest) returns (GetRuntimeInfoResponse);
  rpc InspectMachine(InspectMachineRequest) returns (InspectMachineResponse);
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse);

  // Guest access.
  rpc Exec(ExecRequest) returns (ExecResponse);
  rpc ReadExecOutput(ReadExecOutputRequest) returns (stream ReadExecOutputResponse);
  rpc SignalExec(SignalExecRequest) returns (SignalExecResponse);
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  rpc WriteFile(stream WriteFileRequest) returns (WriteFileResponse);
  rpc PatchFile(PatchFileRequest) returns (PatchFileResponse);
  rpc ListFiles(ListFilesRequest) returns (stream ListFilesResponse);
  rpc SearchFiles(SearchFilesRequest) returns (stream SearchFilesResponse);
  rpc Console(stream ConsoleRequest) returns (stream ConsoleResponse);

  // Images.
  rpc PullImage(PullImageRequest) returns (PullImageResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse);

  // Snapshots.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);

  // Fencing deadline.
  rpc RenewDeadline(RenewDeadlineRequest) returns (RenewDeadlineResponse);
  rpc InspectDeadline(InspectDeadlineRequest) returns (InspectDeadlineResponse);
}

// OutcomeKind is how a call ended (runtime-api.md, Calling rules). The
// gRPC status code carries the kind for a caller that reads no details:
// SUCCESS is OK, REJECTED is INVALID_ARGUMENT, NOT_FOUND is NOT_FOUND,
// CONFLICT is ALREADY_EXISTS, PRECONDITION_FAILED is FAILED_PRECONDITION,
// UNSUPPORTED is UNIMPLEMENTED, FAILED is INTERNAL.
enum OutcomeKind {
  OUTCOME_KIND_UNSPECIFIED = 0;
  OUTCOME_KIND_SUCCESS = 1;
  OUTCOME_KIND_REJECTED = 2;
  OUTCOME_KIND_NOT_FOUND = 3;
  OUTCOME_KIND_CONFLICT = 4;
  OUTCOME_KIND_PRECONDITION_FAILED = 5;
  OUTCOME_KIND_UNSUPPORTED = 6;
  OUTCOME_KIND_FAILED = 7;
  // v1alpha2 never returns it: a repeat waits for the original's outcome
  // (runtime-api.md, Calling rules). Kept because removing a value is a new
  // version (runtime-api.md, Scope and version).
  OUTCOME_KIND_IN_PROGRESS = 8;
}

// Failure is the status detail of every non-OK call.
message Failure {
  OutcomeKind kind = 1;
  string reason = 2;
}

// OutputGone is a status detail of a read of exec output whose offset is older
// than the output still held: the client resumes from earliest_offset.
message OutputGone {
  uint64 earliest_offset = 1;
}

enum MachineState {
  MACHINE_STATE_UNSPECIFIED = 0;
  MACHINE_STATE_CREATED = 1;
  MACHINE_STATE_RUNNING = 2;
  MACHINE_STATE_PAUSED = 3;
  MACHINE_STATE_STOPPED = 4;
  MACHINE_STATE_FAULTED = 5;
}

// Capability is an optional operation a Driver may lack (driver.md).
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_SNAPSHOT = 1;
  CAPABILITY_DISK_HOTPLUG = 2;
  CAPABILITY_CPU_RESIZE = 3;
  CAPABILITY_MEMORY_RESIZE = 4;
  CAPABILITY_CONSOLE = 5;
  CAPABILITY_DISK_RESIZE = 6;
}

// ImageRef locates an image to pull: the repository to fetch it from and the
// content digest to fetch, never a tag. The repository carries no tag and no
// "@"; the digest has the form "sha256:" followed by 64 lowercase hexadecimal
// digits. The Go package refuses any other form before a call is sent.
message ImageRef {
  // For example "registry.example/ns/app" or "registry:5000/app".
  string repository = 1;
  string digest = 2;
}

// NetworkPolicy is the Machine's network policy for its life: an order-free
// allow-list of prefix, protocol, and port-range rules (runtime-api.md).
// An empty policy is the default, which blocks all external traffic.
message NetworkPolicy {
  repeated NetworkRule egress = 1;
  repeated NetworkRule ingress = 2;
}

// PortRange is an inclusive range of port numbers, 1 to 65535.
message PortRange {
  uint32 first = 1;
  uint32 last = 2;
}

// Protocol is the IP protocol a NetworkRule matches.
enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_TCP = 1;
  PROTOCOL_UDP = 2;
  PROTOCOL_ICMP = 3;
  PROTOCOL_ICMPV6 = 4;
  PROTOCOL_ANY = 5;
}

// NetworkRule is one entry in a NetworkPolicy's egress or ingress list.
// A packet passes if any rule of its direction matches (runtime-api.md).
message NetworkRule {
  // An IPv4 prefix (a.b.c.d/n) or an IPv6 prefix (x:x::/n).
  // The prefix's family determines the rule's family.
  string prefix = 1;
  // TCP, UDP, ICMP (IPv4 only), ICMPv6 (IPv6 only), or any protocol.
  Protocol protocol = 2;
  // Destination ports for egress, the Machine's own ports for ingress.
  // Empty means every port; only TCP and UDP rules may set it.
  repeated PortRange ports = 3;
}

// Resources is an absolute target, never a delta. As a resource ceiling, it is
// the most a live resize of the Machine reaches (runtime-api.md); a figure of
// zero in a ceiling a call gives is not set.
message Resources {
  uint32 cpu_count = 1;
  uint64 memory_bytes = 2;
}

// DiskAttachment is one disk the node holds, attached to a Machine.
// A writable attachment is the one writer the node allows per disk.
message DiskAttachment {
  string disk_id = 1;
  bool read_only = 2;
  // Where the guest mounts the disk's filesystem before the entrypoint runs,
  // read-only when read_only is set. Empty mounts nothing. The path is
  // absolute and clean, not "/", and not under /proc, /sys, /dev or
  // /run/mvmd, and the disk's filesystem is ext4, or the call is rejected.
  string mount_path = 3;
}

message Driver {
  string name = 1;
  string version = 2;
}

message Machine {
  string id = 1;
  MachineState state = 2;
  // The reason for the last failure, empty if none.
  string last_failure_reason = 3;
  Driver driver = 4;
  repeated DiskAttachment disks = 5;
  Resources resources = 6;
  uint64 root_disk_bytes = 7;
  // One address per family its node serves.
  repeated string addresses = 8;
  // The network policy in effect for this Machine.
  NetworkPolicy network_policy = 9;
  // The most a live resize reaches. Never below resources: a Machine created
  // with none reports its resources.
  Resources resource_ceiling = 10;
  // The SHA-256 digest, in hex, of the kernel the Machine's running guest was
  // booted with: the kernel the node pinned at the Machine's last start, or the
  // one its snapshot recorded for a Machine restored from it. Empty for a
  // Machine that has never booted.
  string kernel_digest = 11;
  // The name of the node's guest kernel the Machine boots, recorded at Create.
  // Empty for a Machine recorded before kernels had names, which boots the
  // node's default.
  string kernel = 12;
  // The digest of the image the Machine was created or restored from, in the
  // form ImageRef.digest has, reported in every state.
  string image_digest = 13;
  // The names of the environment variables the request set, in the order sent,
  // never their values.
  repeated string env_names = 14;
  // The files the request placed, without their content.
  repeated FileInfo files = 15;
  // The working directory the request set; empty when it set none.
  string working_dir = 16;
  // One entry for each probe the request set, in the order sent. Held in the
  // node's memory only: a Running Machine reports what its guest last sent, a
  // Paused one the last results held, and a Machine in any other state, or
  // one whose guest has sent nothing yet, reports UNKNOWN for each probe.
  repeated ProbeResult probes = 17;
  // Set for an OS-form Machine (ADR 0058) and absent for an image-form one. An
  // OS-form Machine has no image_digest, no root disk, no env_names, files,
  // working_dir or probes.
  OsBoot os_boot = 18;
}

// OsBoot is the OS form of a Machine (ADR 0058): the guest boots a whole
// operating system from a boot set the node names, with no image and no Guest
// Agent, and its disks attached at boot.
message OsBoot {
  // The name of a boot set the node offers, as runtime info lists it: a kernel
  // and an initrd the node pinned by digest. Not empty. A name the node does
  // not offer is REJECTED.
  string boot_set = 1;
  // The kernel command line the client adds. The Driver puts first the
  // parameters its console and stop request need, and this line follows them.
  // At most 2048 bytes, with no NUL and no newline; a line outside that is
  // REJECTED.
  string kernel_cmdline = 2;
}

// A check of the workload that the guest runs on a schedule from the
// entrypoint's start (ADR 0054). The guest acts on no result.
message Probe {
  // Names the probe in results. Not empty, at most 63 bytes of letters,
  // digits, '-', '_' and '.', and not repeated among the probes of a request.
  string name = 1;
  oneof kind {
    ExecProbe exec = 2;
    TcpProbe tcp = 3;
    HttpGetProbe http_get = 4;
  }
  // Time from the entrypoint's start to the first run. Unset is 0; at most 24 h.
  google.protobuf.Duration initial_delay = 5;
  // Time between the starts of runs. Unset is 10 s; from 1 ms to 24 h.
  google.protobuf.Duration period = 6;
  // How long one run may take. Unset is 1 s; from 1 ms to 24 h.
  google.protobuf.Duration timeout = 7;
  // Consecutive successes that make a probe PASSING. 0 is 1.
  uint32 success_threshold = 8;
  // Consecutive failures that make a probe FAILING. 0 is 3.
  uint32 failure_threshold = 9;
}

// A command run in the guest as the entrypoint's user, with its environment
// and working directory. It succeeds on exit code 0.
message ExecProbe {
  // The program and its arguments; the first element is the program.
  repeated string argv = 1;
}

// A connection to the guest's loopback address accepted.
message TcpProbe {
  // 1 to 65535.
  uint32 port = 1;
}

// A GET to the guest's loopback address answered with a status from 200 to
// 399. A redirect is not followed.
message HttpGetProbe {
  // 1 to 65535.
  uint32 port = 1;
  // The request target: it begins with '/' and holds no space, control or
  // non-ASCII character, at most 2048 bytes.
  string path = 2;
  // Empty or "http", the only scheme spoken.
  string scheme = 3;
}

enum ProbeStatus {
  PROBE_STATUS_UNSPECIFIED = 0;
  // The probe has not yet met a threshold, or the node holds no result of it.
  PROBE_STATUS_UNKNOWN = 1;
  PROBE_STATUS_PASSING = 2;
  PROBE_STATUS_FAILING = 3;
}

// The result of one probe, as the guest last sent it.
message ProbeResult {
  // The probe's name.
  string name = 1;
  ProbeStatus status = 2;
  // The guest's clock when status last changed; unset while UNKNOWN.
  google.protobuf.Timestamp changed_at = 3;
  // The runs in a row that succeeded, and the runs in a row that failed; one
  // of them is 0.
  uint32 consecutive_successes = 4;
  uint32 consecutive_failures = 5;
  // Why the most recent failed run failed, as text for people; empty when no
  // run has failed. It never holds output of the workload.
  string last_failure = 6;
  // The first 1 KiB of the output of an ExecProbe's most recent run; empty for
  // the other kinds.
  bytes last_output = 7;
}

// An environment variable of the entrypoint. The value may be secret: mvmd
// never logs it, puts it in an error or returns it.
message EnvVar {
  string name = 1;
  string value = 2;
}

// A file placed in the guest before the entrypoint runs.
message File {
  // Absolute and clean (no "." or ".." element, no empty element, no trailing
  // slash), not "/", and not under /proc, /sys, /dev or /run/mvmd.
  string path = 1;
  // The content. It may be secret: mvmd never logs it, puts it in an error or
  // returns it.
  bytes content = 2;
  // The permission bits, at most 07777.
  uint32 mode = 3;
  uint32 uid = 4;
  uint32 gid = 5;
}

// What a Machine reports of a file it places: everything but the content.
message FileInfo {
  string path = 1;
  uint32 mode = 2;
  uint32 uid = 3;
  uint32 gid = 4;
  uint64 size_bytes = 5;
}

message CreateMachineRequest {
  // Chosen by the client, unique on the node.
  string machine_id = 1;
  string request_id = 2;
  // The digest of an image already on the node, in the form ImageRef.digest
  // has.
  string image_digest = 3;
  Resources resources = 4;
  uint64 root_disk_bytes = 5;
  repeated DiskAttachment disks = 6;
  NetworkPolicy network_policy = 7;
  // Optional. A figure not set is the figure of resources.
  Resources resource_ceiling = 8;
  // Optional. The name of a kernel the node offers, as runtime info lists it.
  // Empty is the node's default; the name is recorded at Create. A name the
  // node does not offer is REJECTED.
  string kernel = 9;
  // Optional. Replaces the image's entrypoint; the image's command is dropped
  // unless args is set, as Kubernetes does. Empty keeps the image's.
  repeated string command = 10;
  // Optional. Replaces the image's command and keeps its entrypoint, unless
  // command is set. Empty keeps the image's. An image pulled before the node
  // kept its entrypoint and command apart has no command to replace: args
  // alone on it is PRECONDITION_FAILED, naming the image; pull it again.
  repeated string args = 11;
  // Optional. Applied over the image's environment by name. An empty name, a
  // name containing "=" and a name given twice are REJECTED.
  repeated EnvVar env = 12;
  // Optional. The user the entrypoint runs as, in the OCI image-config form
  // ("user", "uid", "user:group", "uid:gid"). Empty is the image's config User,
  // and root where the image sets none. A name that does not resolve in the
  // guest fails the Machine's start.
  string user = 13;
  // Optional. Files placed before the entrypoint runs, at every start of the
  // Machine. At most 64 files and 1 MiB of content in all, no path twice, and
  // a mode of at most 07777; a request outside that is REJECTED, naming the
  // field and the path.
  repeated File files = 14;
  // Optional. The directory the entrypoint runs in: absolute and clean (no "."
  // or ".." element, no empty element, no trailing slash). Empty is the image's
  // working directory. A path that is not absolute and clean is REJECTED,
  // naming it. It is kept with the Machine and used at every start.
  string working_dir = 15;
  // Optional. Probes the guest runs on the workload from the entrypoint's
  // start, at every start of the Machine. At most 8, each with a name not used
  // twice, a kind and values within the limits the Probe message states; a
  // request outside that is REJECTED, naming the probe. A start does not
  // change them.
  repeated Probe probes = 16;
  // Optional. Present makes an OS-form Machine (ADR 0058), which boots the
  // named boot set with the command line and has no image and no Guest Agent.
  // With it, image_digest, root_disk_bytes, kernel, command, args, env, user,
  // files, working_dir and probes must all be unset: a field set is REJECTED,
  // naming it. resources, resource_ceiling, disks and network_policy mean what
  // they mean for the image form, and a disk's mount_path must be empty.
  OsBoot os_boot = 17;
}

message CreateMachineResponse {
  Machine machine = 1;
}

// New environment and files for the next start of a Machine, which replace the
// ones the Machine holds. A repeated field has no presence, so the message
// carries it.
message RunUpdate {
  // Replaces the Machine's environment as a whole; empty clears it. The same
  // rules as at Create.
  repeated EnvVar env = 1;
  // Replaces the Machine's files as a whole; empty clears them. The same rules
  // and bounds as at Create.
  repeated File files = 2;
}

message StartMachineRequest {
  string machine_id = 1;
  // Optional. Present replaces the Machine's env and files in its record, then
  // the start boots with them; a request outside the rules of Create is
  // REJECTED and changes nothing. Absent keeps the record's. Command, args,
  // user and working directory are not changed by a start. On a Machine that is
  // Running, present is accepted only when it equals what the record holds.
  RunUpdate run_update = 2;
}

message StartMachineResponse {
  Machine machine = 1;
}

message StopMachineRequest {
  string machine_id = 1;
  // How long the guest has to stop before the VMM is terminated.
  google.protobuf.Duration grace_period = 2;
}

message StopMachineResponse {
  Machine machine = 1;
}

message PauseMachineRequest {
  string machine_id = 1;
}

message PauseMachineResponse {
  Machine machine = 1;
}

message ResumeMachineRequest {
  string machine_id = 1;
}

message ResumeMachineResponse {
  Machine machine = 1;
}

message SnapshotMachineRequest {
  string snapshot_id = 1;
  string request_id = 2;
  string machine_id = 3;
}

message SnapshotMachineResponse {
  string snapshot_id = 1;
}

message RestoreMachineRequest {
  // The new Machine's identifier, chosen by the client.
  string machine_id = 1;
  string request_id = 2;
  string snapshot_id = 3;
  NetworkPolicy network_policy = 4;
}

message RestoreMachineResponse {
  Machine machine = 1;
}

message DeleteMachineRequest {
  string machine_id = 1;
}

message DeleteMachineResponse {}

// Filesystem is what a disk's file holds when CreateDisk has made it.
enum Filesystem {
  // In a request, what CreateDisk made before the field existed: ext4. A Disk
  // never reports it.
  FILESYSTEM_UNSPECIFIED = 0;
  // Unformatted: the guest finds a block device with nothing on it.
  FILESYSTEM_NONE = 1;
  // Formatted by the node with mkfs.ext4 before CreateDisk returns.
  FILESYSTEM_EXT4 = 2;
}

message CreateDiskRequest {
  // The disk's identifier, chosen by the client.
  string disk_id = 1;
  string request_id = 2;
  // The size of the sparse raw file.
  uint64 size_bytes = 3;
  // A value other than the ones above is rejected.
  Filesystem filesystem = 4;
  // When set, the disk starts as a copy of this disk snapshot (SnapshotDisk).
  // It takes the snapshot's filesystem: filesystem may be unspecified or the
  // snapshot's, and any other value is rejected. size_bytes is at least the
  // snapshot's size_bytes, and a larger size grows the new file, which the guest
  // grows the filesystem into at the next start. An unknown snapshot is not
  // found. The snapshot joins request_id, size_bytes and filesystem in what a
  // repeated call is compared against.
  string from_snapshot_id = 5;
  // The bytes the disk holds from offset 0, at most 1 MiB, with filesystem
  // FILESYSTEM_NONE set; any other filesystem, including unspecified, and a
  // from_snapshot_id are rejected, as are more than 1 MiB. size_bytes is at
  // least the length of contents and, when it is zero, the length rounded up to
  // a multiple of 512. The bytes are synced before the call returns. The
  // contents join request_id, size_bytes and filesystem in what a repeated call
  // is compared against. Empty contents are no contents.
  bytes contents = 6;
}

message CreateDiskResponse {
  Disk disk = 1;
}

// Disk is a disk the node holds: a Machine's root disk or one CreateDisk made.
message Disk {
  string id = 1;
  uint64 size_bytes = 2;
  // The Machine that holds the disk; empty when none does.
  string holder_machine_id = 3;
  // What the disk's file holds. A disk made before the node recorded it, and
  // a Machine's root disk, report ext4.
  Filesystem filesystem = 4;
}

message ListDisksRequest {}

message ListDisksResponse {
  // Ordered by id.
  repeated Disk disks = 1;
}

// ResizeDiskRequest grows a disk. A size below the disk's current size is
// rejected; an equal size succeeds and changes nothing.
message ResizeDiskRequest {
  string disk_id = 1;
  // The new size of the raw file.
  uint64 size_bytes = 2;
}

message ResizeDiskResponse {}

// SnapshotDiskRequest copies a disk into a disk snapshot, at most once per
// request_id. A disk a Running Machine holds is copied with the Machine paused
// and returned to Running, and the copy is crash-consistent: it holds what the
// guest had written to the disk and not what it held in memory. A disk no
// Machine holds, or one a Created, Stopped or Paused Machine holds, is copied as
// it is. Any other holder state is rejected as a failed precondition.
message SnapshotDiskRequest {
  // The disk to copy.
  string disk_id = 1;
  // The disk snapshot's identifier, chosen by the client. It obeys the rules of
  // a disk identifier.
  string snapshot_id = 2;
  string request_id = 3;
}

message SnapshotDiskResponse {
  DiskSnapshot disk_snapshot = 1;
}

// DiskSnapshot is what the node holds of one disk snapshot.
message DiskSnapshot {
  string id = 1;
  // The disk the snapshot was taken of, which may no longer exist.
  string disk_id = 2;
  // The size of the disk's file when it was copied: the least a disk made from
  // the snapshot has.
  uint64 size_bytes = 3;
  // What the disk held, which a disk made from the snapshot holds.
  Filesystem filesystem = 4;
  // The disk space the snapshot's file occupies: allocated blocks, not apparent
  // size.
  uint64 allocated_bytes = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListDiskSnapshotsRequest {}

message ListDiskSnapshotsResponse {
  // Ordered by id.
  repeated DiskSnapshot disk_snapshots = 1;
}

// DeleteDiskSnapshotRequest removes a disk snapshot; an absent one succeeds. A
// snapshot a SnapshotDisk or CreateDisk call is using is rejected as a failed
// precondition. The disk the snapshot was taken of is not touched.
message DeleteDiskSnapshotRequest {
  string snapshot_id = 1;
}

message DeleteDiskSnapshotResponse {}

message DeleteDiskRequest {
  string disk_id = 1;
}

message DeleteDiskResponse {}

message AttachDiskRequest {
  string machine_id = 1;
  DiskAttachment disk = 2;
}

message AttachDiskResponse {
  Machine machine = 1;
}

message DetachDiskRequest {
  string machine_id = 1;
  string disk_id = 2;
}

message DetachDiskResponse {
  Machine machine = 1;
}

message SetResourcesRequest {
  string machine_id = 1;
  Resources target = 2;
  // Optional. A figure not set leaves the Machine's ceiling figure as it is.
  // The ceiling changes only while the Machine is not Running or Paused.
  Resources resource_ceiling = 3;
}

message SetResourcesResponse {
  // The resources in effect, which differ from the target after a failure.
  Resources resources = 1;
  // The ceiling in effect.
  Resources resource_ceiling = 2;
}

message GetRuntimeInfoRequest {}

message DriverInfo {
  Driver driver = 1;
  repeated Capability capabilities = 2;
  // The host CPU model the Driver runs guests on. A restore needs a snapshot
  // whose cpu_model equals this value.
  string cpu_model = 3;
  // The most of a Machine the Driver accepts. A Create machine or Set resources
  // beyond them is REJECTED; a Restore of a snapshot beyond them is
  // PRECONDITION_FAILED. Absent when the Driver reports none.
  DriverLimits limits = 4;
}

// DriverLimits are the upper bounds the Driver in service enforces on a
// Machine's resources and resource ceiling.
message DriverLimits {
  // The most vCPUs a Machine has. Zero states no bound.
  uint32 max_vcpus = 1;
}

// NodeCapacity is what the node has, as totals it measures. It is not what is
// left after the Machines' share: a client derives that from List, which
// reports each Machine's resources. mvmd admits no call by the measured
// figures; machine_limit is a configured count, which a call finds spent.
message NodeCapacity {
  // The logical CPUs the node's processes may run on, as the kernel's
  // sched_getaffinity reports them for mvmd, which its VMMs inherit.
  uint32 cpus = 1;
  // The host's total memory in bytes: MemTotal of /proc/meminfo.
  uint64 memory_bytes = 2;
  // The total size in bytes of the filesystem of mvmd's state directory, which
  // holds the disks, the snapshots and the image store: statfs f_blocks times
  // f_frsize.
  uint64 state_total_bytes = 3;
  // The bytes of that filesystem available to an unprivileged process: statfs
  // f_bavail times f_frsize, read at each call.
  uint64 state_available_bytes = 4;
  // The most Machines the node can hold: the smaller of the node's VMM user
  // range and, for each IP family the node serves, the addresses its prefix has
  // to assign. It is the node's configuration, not a measurement. A Create
  // machine or Restore that would pass it is PRECONDITION_FAILED.
  uint32 machine_limit = 5;
  // The Machines the node holds: the ones List machines returns.
  uint32 machines = 6;
}

// NodeKernel is a guest kernel the node offers a Machine by name.
message NodeKernel {
  // 1 to 63 characters of lowercase letters, digits and "-".
  string name = 1;
  // The SHA-256 digest of the kernel file the node pinned, in hex.
  string digest = 2;
  // Whether a Create machine that names no kernel gets this one.
  bool is_default = 3;
}

// BootSet is a kernel and an initrd the node offers an OS-form Machine by name
// (ADR 0058). A client never uploads either.
message BootSet {
  // 1 to 63 characters of lowercase letters, digits and "-".
  string name = 1;
  // The SHA-256 digests of the kernel file and the initrd file the node pinned,
  // in hex.
  string kernel_digest = 2;
  string initrd_digest = 3;
}

message GetRuntimeInfoResponse {
  // The API versions served, as package identifiers (for example
  // "mvmd.runtime.v1alpha2").
  repeated string api_versions = 1;
  repeated DriverInfo drivers = 2;
  NodeCapacity capacity = 3;
  // The kernels the node offers, ordered by name; exactly one is the default.
  repeated NodeKernel kernels = 4;
  // The prefixes the node assigns Machine addresses from, one for each IP
  // family the node's network configuration names, in CIDR form with the host
  // bits clear, IPv4 first. Empty when the node has no network configuration.
  repeated string machine_prefixes = 5;
  // The boot sets the node offers an OS-form Machine, ordered by name. Empty
  // when the node offers none.
  repeated BootSet boot_sets = 6;
}

message InspectMachineRequest {
  string machine_id = 1;
}

message InspectMachineResponse {
  Machine machine = 1;
}

message ListMachinesRequest {}

message ListMachinesResponse {
  repeated Machine machines = 1;
}

message WatchEventsRequest {
  // Resume after this sequence number. Zero starts at the oldest event held.
  uint64 after_sequence = 1;
}

message StateChanged {
  MachineState state = 1;
}

// MachineDeleted says the Machine named by machine_id no longer exists. A
// deleted Machine has no state, so this is not a StateChanged.
message MachineDeleted {}

message DeadlineEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ARMED = 1;
    KIND_RENEWED = 2;
    KIND_EXPIRED = 3;
  }
  Kind kind = 1;
}

message DriverEvent {
  string name = 1;
  string detail = 2;
}

// ProbeChanged says a probe of the Machine named by machine_id has a result
// other than the one the node held. It is sent for a Running or Paused
// Machine only: a Machine that leaves Running reports its probes UNKNOWN with
// no ProbeChanged, since the StateChanged says so.
message ProbeChanged {
  ProbeResult result = 1;
}

// ResyncRequired says the events after the requested sequence are no longer
// held; the client lists to resynchronise.
message ResyncRequired {}

message WatchEventsResponse {
  // Grows on this node. Zero on ResyncRequired.
  uint64 sequence = 1;
  // Empty on ResyncRequired and on a node-wide event.
  string machine_id = 2;
  oneof event {
    StateChanged state_changed = 3;
    DeadlineEvent deadline = 4;
    DriverEvent driver = 5;
    ResyncRequired resync_required = 6;
    MachineDeleted machine_deleted = 7;
    ProbeChanged probe_changed = 8;
  }
}

enum ExecStatus {
  EXEC_STATUS_UNSPECIFIED = 0;
  EXEC_STATUS_STARTED = 1;
  EXEC_STATUS_NOT_STARTED = 2;
  // The Machine stopped while the command ran.
  EXEC_STATUS_CUT_SHORT = 3;
  // The command ended; exit_code is set.
  EXEC_STATUS_EXITED = 4;
}

message ExecRecord {
  string exec_id = 1;
  ExecStatus status = 2;
  // Why the command did not start or was cut short.
  string reason = 3;
  // The command's exit code; meaningful only when status is EXITED.
  int32 exit_code = 4;
  // The signal number that ended the command, as on Linux; set only when
  // status is EXITED and a signal ended the command, zero otherwise.
  int32 term_signal = 5;
  // When the command ended, by the guest's clock, not the node's: the Guest
  // Agent's reading of CLOCK_REALTIME when it reaped the command. The node
  // sets that clock at Boot and at a restore, and between those it is the
  // guest's own. Set only when status is EXITED, and unset where the time is
  // not known.
  google.protobuf.Timestamp ended_at = 6;
}

message ExecRequest {
  string exec_id = 1;
  string request_id = 2;
  string machine_id = 3;
  repeated string command = 4;
  map<string, string> env = 5;
  string working_dir = 6;
}

message ExecResponse {
  ExecRecord record = 1;
}

message ReadExecOutputRequest {
  string machine_id = 1;
  string exec_id = 2;
  // Resume after this offset; zero starts at the beginning.
  uint64 after_offset = 3;
  // When non-zero, start this many bytes before the end of the output held
  // when the call arrives, or at the earliest byte held if fewer are held,
  // and then follow as usual. Zero leaves it unset. Setting it with a
  // non-zero after_offset is rejected.
  uint64 tail_bytes = 4;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

// OutputChunk is output of the command. offset is the position of the chunk's
// first byte in the exec's output as one sequence, stdout and stderr in the
// order mvmd received them.
message OutputChunk {
  OutputStream stream = 1;
  uint64 offset = 2;
  bytes data = 3;
}

// ReadExecOutputResponse is a chunk of output, or the exec record that ends
// the stream once the command has ended.
message ReadExecOutputResponse {
  oneof part {
    OutputChunk chunk = 1;
    ExecRecord record = 2;
  }
}

// SignalExecRequest delivers a signal to a command that runs. signal is a
// signal number, as on Linux.
message SignalExecRequest {
  string machine_id = 1;
  string exec_id = 2;
  int32 signal = 3;
}

message SignalExecResponse {}

message ReadFileRequest {
  string machine_id = 1;
  string path = 2;
}

// ReadFileResponse is one chunk of the file, in order.
message ReadFileResponse {
  bytes chunk = 1;
}

message WriteFileStart {
  string machine_id = 1;
  string path = 2;
}

// WriteFileRequest is the first message of a stream carrying start, then
// messages carrying chunks. The new content is committed whole at a clean end
// of the stream; a stream that breaks leaves the old content.
message WriteFileRequest {
  oneof part {
    WriteFileStart start = 1;
    bytes chunk = 2;
  }
}

message WriteFileResponse {}

message PatchFileRequest {
  string machine_id = 1;
  string path = 2;
  // Content digests, "sha256:" followed by 64 lowercase hexadecimal digits.
  string base_digest = 3;
  string expected_digest = 4;
  bytes patch = 5;
}

message PatchFileResponse {}

message ListFilesRequest {
  string machine_id = 1;
  // An absolute directory path.
  string path = 2;
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_FILE = 1;
  ENTRY_KIND_DIRECTORY = 2;
  ENTRY_KIND_SYMLINK = 3;
  ENTRY_KIND_OTHER = 4;
}

// FileEntry is one entry of a directory. size is in bytes.
message FileEntry {
  string path = 1;
  EntryKind kind = 2;
  uint64 size = 3;
}

// ListFilesResponse is a run of the directory's entries. The entries of all
// the messages of the stream, in order, are sorted by path.
message ListFilesResponse {
  repeated FileEntry entries = 1;
}

message SearchFilesRequest {
  string machine_id = 1;
  // An absolute directory path; the search covers its tree.
  string path = 2;
  // A glob matched against an entry's path relative to the directory. "*" and
  // "?" do not cross "/", "**" does, and "{a,b}" and "[ab]" are supported; the
  // syntax is the Guest Agent's, the globset crate's glob with "/" a literal
  // separator (https://docs.rs/globset/0.4.21/globset/#syntax).
  string pattern = 3;
}

// SearchFilesResponse is a run of the paths that match. The paths of all the
// messages of the stream, in order, are sorted.
message SearchFilesResponse {
  repeated string matches = 1;
}

// ConsoleRequest carries the Machine in the first message of a session and
// input bytes after it.
message ConsoleRequest {
  string machine_id = 1;
  bytes input = 2;
}

message ConsoleResponse {
  bytes output = 1;
}

message PullImageRequest {
  ImageRef image = 1;
}

message PullImageResponse {}

// Image is what the node holds of one image, for a client to decide whether to
// keep it.
message Image {
  // The digest the image was pulled by, in the form ImageRef.digest has.
  string digest = 1;
  // The disk space the node's files for the image occupy: allocated blocks, not
  // apparent size, summed over every file the node holds for it.
  uint64 size_bytes = 2;
  // When the node stored the image. Unset for an image stored before the node
  // recorded it.
  google.protobuf.Timestamp created_at = 3;
}

message ListImagesRequest {}

message ListImagesResponse {
  // Ordered by digest.
  repeated Image images = 1;
}

message RemoveImageRequest {
  // The digest the image was pulled by, as ListImages reports it.
  string digest = 1;
}

message RemoveImageResponse {}

// Snapshot is what the node holds of one snapshot, for a client to decide
// whether to keep it.
message Snapshot {
  string id = 1;
  // The Machine the snapshot was taken from, which may no longer exist.
  string machine_id = 2;
  // The digest of the image the snapshot's Machine runs, in the form
  // ImageRef.digest has.
  string image_digest = 3;
  // The VMM that made it; a restore needs the same name, version and CPU model.
  Driver driver = 4;
  string cpu_model = 5;
  // The size of the root disk the snapshot holds a copy of.
  uint64 root_disk_bytes = 6;
  // The SHA-256 digest, in hex, of the guest kernel the snapshot's Machine was
  // running when the snapshot was taken. Empty when the snapshot recorded none.
  string kernel_digest = 7;
  // The name the snapshot's Machine had recorded for its kernel. Empty when the
  // snapshot recorded none. A restore matches on kernel_digest alone.
  string kernel = 9;
  // The disks the snapshot's Machine had attached. A restore takes exactly
  // these, and is refused for one the node does not hold, one a Machine holds
  // or one whose file was written since.
  repeated SnapshotDisk disks = 8;
  // The disk space the node's files for the snapshot occupy: allocated blocks,
  // not apparent size, summed over every file in its directory, the root disk
  // copy included.
  uint64 size_bytes = 10;
  // When the node stored the snapshot. Unset for a snapshot stored before the
  // node recorded it.
  google.protobuf.Timestamp created_at = 11;
}

message SnapshotDisk {
  string disk_id = 1;
  bool read_only = 2;
  // The size of the disk's file when the snapshot was taken.
  uint64 size_bytes = 3;
  // Where the disk was mounted in the guest; a restore mounts it there again.
  string mount_path = 4;
}

message ListSnapshotsRequest {}

message ListSnapshotsResponse {
  // Ordered by id.
  repeated Snapshot snapshots = 1;
}

message DeleteSnapshotRequest {
  string snapshot_id = 1;
}

message DeleteSnapshotResponse {}

enum DeadlinePhase {
  DEADLINE_PHASE_UNSPECIFIED = 0;
  DEADLINE_PHASE_NOT_ARMED = 1;
  DEADLINE_PHASE_ARMED = 2;
  DEADLINE_PHASE_EXPIRED = 3;
  // Expired and every Machine under it stopped.
  DEADLINE_PHASE_STOPPED_EVERYTHING = 4;
}

message DeadlineStatus {
  DeadlinePhase phase = 1;
  google.protobuf.Duration length = 2;
  google.protobuf.Duration remaining = 3;
  uint64 last_renewal_number = 4;
}

message RenewDeadlineRequest {
  google.protobuf.Duration length = 1;
  uint64 renewal_number = 2;
}

message RenewDeadlineResponse {
  DeadlineStatus status = 1;
}

message InspectDeadlineRequest {}

message InspectDeadlineResponse {
  DeadlineStatus status = 1;
}
