[package]
name = "imageconv"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "imageconv-channel"
path = "src/imageconv_channel.rs"

[lints]
workspace = true

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
futures-core = "0.3.34"
nix = { version = "0.31.3", features = ["fs", "mount", "reboot", "signal"] }
prost = "0.14.4"
ruzstd = "0.9.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-vsock = { version = "0.7.3", features = ["tonic014"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.9"

[dev-dependencies]
hyper-util = "0.1.21"
tar = "0.4.46"
tempfile = "3.27.0"
tower = "0.5.3"
