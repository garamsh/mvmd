[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
