// The guest channel contract, v1alpha1. Its meaning is fixed by
// docs/architecture/guest.md and docs/architecture/runtime-api.md
// (Guest access); this file is the encoding.
syntax = "proto3";

package mvmd.guest.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// GuestService is the guest channel. The Guest Agent serves it over vsock.
service GuestService {
  // Describe the Machine to the agent, which runs as the guest's init and
  // waits for this call before it touches a disk. Before any boot step the
  // agent sets the wall clock to host_unix_nanos when that is positive, and
  // leaves it as the kernel set it when it is 0. The call returns once the
  // entrypoint runs, or fails naming the boot step that failed; every other
  // call except Terminate, Health, Info, FindDisk, ReleaseDisk, GrowDisk and
  // OnlineVcpus is refused until it has succeeded. A repeat with the same
  // description succeeds and changes nothing, whatever time it carries, and
  // does not set the clock again; a repeat after a failure fails the same
  // way.
  rpc Boot(BootRequest) returns (BootResponse);
  // Replace the network configuration of a running Machine. The agent
  // applies it whole: what it applied before is removed. After a restore the
  // client sends CatchUp, which applies the network itself, and not this.
  rpc UpdateNetwork(UpdateNetworkRequest) returns (UpdateNetworkResponse);
  // Catch a guest up after a snapshot restore: mix the entropy into the
  // kernel's pool and reseed it, set the wall clock to the host's time, then
  // apply the network, in that order. The call returns once all three are
  // done, which tells the client the agent has caught up. A repeat with the
  // restore ID of the last call that succeeded succeeds and changes nothing.
  rpc CatchUp(CatchUpRequest) returns (CatchUpResponse);

  // Start a command under the client's exec ID. A repeated start with the
  // same ID returns the same record and never runs the command twice.
  rpc Exec(ExecRequest) returns (ExecResponse);
  // Stream the output after an offset. The stream follows a running
  // command and ends with the final record.
  rpc ReadExecOutput(ReadExecOutputRequest)
      returns (stream ReadExecOutputResponse);
  // Deliver a signal to a running command.
  rpc Signal(SignalRequest) returns (SignalResponse);

  // Follow the results of the probes RunConfig.probes describes. On open the
  // stream sends the current result of every probe, one message each in the
  // order of the description, and then one message for each probe's change of
  // status. It ends after the entrypoint ends, once every result is sent; a
  // call after that sends the current results and ends. A client too slow to
  // keep up is sent the current result of every probe again in place of the
  // changes it missed. The agent acts on no result. It is refused until Boot
  // has succeeded, and a description with no probes sends nothing before the
  // stream ends.
  rpc WatchProbes(WatchProbesRequest) returns (stream WatchProbesResponse);

  // Read a file as a stream of chunks.
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  // Write a file atomically: whole old or whole new content. The stream is
  // a start, chunks, then an end that carries the content digest; a stream
  // that breaks before its end leaves the old content.
  rpc WriteFile(stream WriteFileRequest) returns (WriteFileResponse);
  // Patch a file, guarded by a base and an expected digest.
  rpc PatchFile(PatchFileRequest) returns (PatchFileResponse);

  // List a directory. The entries come sorted by path across the messages
  // of the stream, so no listing is bounded by one message.
  rpc ListFiles(ListFilesRequest) returns (stream ListFilesResponse);
  // Search a directory tree by glob. The matches come sorted by path across
  // the messages of the stream.
  rpc SearchFiles(SearchFilesRequest) returns (stream SearchFilesResponse);

  // Ask the guest to stop, as a SIGTERM to its init does: the agent forwards
  // SIGTERM to the entrypoint, or ends the Machine when the entrypoint is not
  // running. It is served before Boot has succeeded, since a Machine that
  // has not booted has no entrypoint to terminate. The call returns once the
  // agent has taken the request, not when the Machine has ended. A repeat
  // sends SIGTERM again.
  rpc Terminate(TerminateRequest) returns (TerminateResponse);

  // Find the block device of a disk mvmd has just hot-plugged: the agent asks
  // the kernel to rescan the PCI bus, since the VMM sends no hotplug
  // notification, and takes the one virtio block device that appears. It
  // records disk_id against that device and returns it. A repeat for a
  // disk_id the agent holds returns the record without rescanning, and for
  // one it has released rescans as for a new one. No new device within the
  // agent's bound, or more than one, fails the call and records nothing. The
  // agent mounts the device only when mount_path is set. It is served
  // before Boot has succeeded, and the calls of one Machine are serialised.
  // With a mount_path the agent mounts the device's ext4 filesystem there, in
  // the booted root: before Boot has succeeded the mount is made at the boot
  // step that follows placing the files, and after it, before this call
  // returns. A repeat for a disk_id the agent holds must carry the same
  // mount_path and read_only, or it is FAILED_PRECONDITION; once the mount
  // is made a repeat does not make it again.
  rpc FindDisk(FindDiskRequest) returns (FindDiskResponse);

  // Release the device FindDisk recorded under disk_id so that mvmd can
  // unplug it: the agent opens the block device exclusively, which the kernel
  // refuses while the device or a partition of it is mounted or otherwise
  // claimed, and that is FAILED_PRECONDITION with a DiskInUse detail;
  // otherwise it removes the device from the PCI bus, still holding the
  // device. A filesystem the agent mounted for the disk is unmounted first,
  // and one that is busy fails the call the same way, the message naming the
  // path. The agent keeps the record as released, so a repeat after a
  // release succeeds. A disk_id the agent never found is NOT_FOUND. It is
  // served before Boot has succeeded.
  rpc ReleaseDisk(ReleaseDiskRequest) returns (ReleaseDiskResponse);

  // Read the size of a found disk again, after mvmd has grown its backing,
  // and grow the ext4 filesystem the agent mounted for it online to fill the
  // device (EXT4_IOC_RESIZE_FS). It returns the device's size in bytes. A
  // disk with no mount only has its size read. A repeat grows nothing. A
  // disk_id the agent never found, or has released, is NOT_FOUND. It is
  // served before Boot has succeeded.
  rpc GrowDisk(GrowDiskRequest) returns (GrowDiskResponse);

  // Bring vCPUs online up to a target count. The kernel does not bring a
  // hot-added vCPU online, so the agent counts the online CPUs and, while
  // fewer than the target are online, writes 1 to the online file of the
  // lowest-numbered present, offline CPU. At or above the target it writes
  // nothing, so a CPU the guest took offline, or one being removed, is left
  // as it is. It returns the online vCPU count and the memory the kernel
  // reports; the caller judges whether they reached its target. A target of 0
  // is INVALID_ARGUMENT. A CPU that does not come online fails the call, and
  // the message names it. A repeat returns the same counts. It is served
  // before Boot has succeeded.
  rpc OnlineVcpus(OnlineVcpusRequest) returns (OnlineVcpusResponse);

  // Whether the agent serves.
  rpc Health(HealthRequest) returns (HealthResponse);
  // The agent version and the contract versions it serves.
  rpc Info(InfoRequest) returns (InfoResponse);
}

message BootRequest {
  // The filesystem UUID of the MachineImage's EROFS and of the root disk's
  // ext4, each as 32 hexadecimal digits in the 8-4-4-4-12 form. The agent
  // mounts the block device that carries each.
  string image_uuid = 1;
  string root_disk_uuid = 2;
  // The entrypoint. It runs as the exec record with the ID "entrypoint",
  // so its output, its signals and its end are read through the exec calls.
  RunConfig run = 3;
  NetworkConfig network = 4;
  // The host's wall clock when the request was made, in nanoseconds since the
  // Unix epoch. The agent sets the clock to it before the first boot step. 0
  // leaves the clock alone; a negative value is refused as invalid. It is not
  // part of the description a repeat is compared by.
  int64 host_unix_nanos = 5;
}

message BootResponse {}

message RunConfig {
  // The program and its arguments; the first element is the program.
  repeated string argv = 1;
  // Environment variables. The entrypoint's environment is exactly these.
  map<string, string> env = 2;
  // Working directory in the booted root; empty keeps "/".
  string working_dir = 3;
  // The user the entrypoint runs as, in the OCI image-config form: "user",
  // "uid", "user:group", "uid:gid", "user:gid" or "uid:group". Names resolve
  // against the booted root's /etc/passwd and /etc/group, after the files
  // below are placed. With no group the gid is the user's primary group, or 0
  // for a uid with no passwd entry. A user name brings the supplementary
  // groups /etc/group lists for it, a bare uid none. The agent calls
  // setgroups, setgid and then setuid, and sets HOME from passwd when env has
  // none. Empty runs as root (0:0) with nothing applied. A name that does not
  // resolve fails the boot at BOOT_STEP_APPLY_USER.
  string user = 4;
  // Files placed in the booted root before the entrypoint runs, at step
  // BOOT_STEP_PLACE_FILES. Their content is written to a tmpfs only the agent
  // mounts, never to the root disk, and each file is bind-mounted read-only
  // onto its path, shadowing what the image holds there. At most 64 files and
  // 1 MiB of content in all.
  repeated File files = 5;
  // Probes of the workload, run by the agent from the entrypoint's start. At
  // most 8, with names that are not repeated. They are part of the
  // description a repeat of Boot is compared by, with the defaults applied.
  repeated Probe probes = 6;
}

// A check of the workload the agent runs on a schedule. The first run is
// initial_delay after the entrypoint starts, and each next one a period after
// the one before it started, until the entrypoint ends; runs of one probe do
// not overlap. A run succeeds or fails, and a run that is not over within
// timeout fails.
message Probe {
  // Names the probe in results. Not empty, at most 63 bytes of letters,
  // digits, '-', '_' and '.', and not repeated among the probes of a
  // description.
  string name = 1;
  oneof kind {
    ExecProbe exec = 2;
    TcpProbe tcp = 3;
    HttpGetProbe http_get = 4;
  }
  // Time from the entrypoint's start to the first run. Unset is 0.
  google.protobuf.Duration initial_delay = 5;
  // Time between the starts of runs. Unset is 10 s; at least 1 ms.
  google.protobuf.Duration period = 6;
  // How long one run may take. Unset is 1 s; at least 1 ms.
  google.protobuf.Duration timeout = 7;
  // Consecutive successes that make a probe PASSING. 0 is 1.
  uint32 success_threshold = 8;
  // Consecutive failures that make a probe FAILING. 0 is 3.
  uint32 failure_threshold = 9;
}

// A command run in the booted root, as the run configuration's user, with its
// environment and working directory. It succeeds on exit code 0. It runs
// outside the exec table: it has no exec ID and its output is not retained
// beyond the first 1 KiB, which the result carries.
message ExecProbe {
  // The program and its arguments; the first element is the program.
  repeated string argv = 1;
}

// A connection to the guest's loopback address accepted: 127.0.0.1, or ::1
// when the Boot request's network configures IPv6 and no IPv4.
message TcpProbe {
  // 1 to 65535.
  uint32 port = 1;
}

// A GET to the guest's loopback address, chosen as TcpProbe chooses it, that
// is answered with a status from 200 to 399. A redirect is not followed.
message HttpGetProbe {
  // 1 to 65535.
  uint32 port = 1;
  // The request target: it begins with '/' and holds no space, control or
  // non-ASCII character, at most 2048 bytes.
  string path = 2;
  // Empty or "http", the only scheme spoken.
  string scheme = 3;
}

enum ProbeStatus {
  PROBE_STATUS_UNSPECIFIED = 0;
  // The probe has not yet met a threshold.
  PROBE_STATUS_UNKNOWN = 1;
  // success_threshold consecutive runs succeeded, and no failure_threshold
  // consecutive runs have failed since.
  PROBE_STATUS_PASSING = 2;
  // failure_threshold consecutive runs failed, and no success_threshold
  // consecutive runs have succeeded since.
  PROBE_STATUS_FAILING = 3;
}

message ProbeResult {
  // The probe's name.
  string name = 1;
  ProbeStatus status = 2;
  // The guest's CLOCK_REALTIME when status last changed; unset while UNKNOWN.
  google.protobuf.Timestamp changed_at = 3;
  // The runs in a row that succeeded, and the runs in a row that failed; one
  // of them is 0.
  uint32 consecutive_successes = 4;
  uint32 consecutive_failures = 5;
  // Why the most recent failed run failed, as text for people; empty when no
  // run has failed. It never holds output of the workload.
  string last_failure = 6;
  // The first 1 KiB of the output (standard output and standard error, in the
  // order read) of an ExecProbe's most recent run; empty for the other kinds.
  bytes last_output = 7;
}

message WatchProbesRequest {}

message WatchProbesResponse {
  ProbeResult result = 1;
}

// A file placed in the booted root.
message File {
  // Absolute and clean (no "." or ".." element, no empty element, no trailing
  // slash), not "/", and not under /proc, /sys, /dev or /run/mvmd. Missing
  // parent directories are created (0755, root), and an empty target file
  // where none exists.
  string path = 1;
  // The content. It may be secret: the agent never writes it to a log, the
  // console, an error message or a status detail.
  bytes content = 2;
  // The permission bits, at most 07777.
  uint32 mode = 3;
  uint32 uid = 4;
  uint32 gid = 5;
}

// What the agent configures on the Machine's one network interface. A family
// whose message is absent is not served and gets nothing.
message NetworkConfig {
  Ipv4Config ipv4 = 1;
  Ipv6Config ipv6 = 2;
  // Resolver addresses, written to /etc/resolv.conf in this order.
  repeated string resolvers = 3;
}

message Ipv4Config {
  // The Machine's address with its prefix length, as "a.b.c.d/n".
  string address = 1;
  // The default route's next hop, as "a.b.c.d".
  string gateway = 2;
}

message Ipv6Config {
  // The Machine's address with its prefix length, as "x:x::x/n".
  string address = 1;
  // The default route's next hop, as an address.
  string gateway = 2;
}

message UpdateNetworkRequest {
  NetworkConfig network = 1;
}

message UpdateNetworkResponse {}

message CatchUpRequest {
  // Chosen by the client, unique to this restore. A call whose ID is that of
  // the last call that succeeded is a repeat.
  string restore_id = 1;
  // Fresh random bytes, from 32 to 256 of them, drawn on the host. The agent
  // mixes them into the kernel's pool and counts them as entropy, so they
  // must come from a cryptographically secure source and never be sent for
  // two restores.
  bytes entropy = 2;
  // The host's wall clock when the request was made, in nanoseconds since the
  // Unix epoch. Must be positive.
  int64 host_unix_nanos = 3;
  // The Machine's network after the restore; required.
  NetworkConfig network = 4;
}

message CatchUpResponse {}

enum ExecStatus {
  EXEC_STATUS_UNSPECIFIED = 0;
  // The command did not start; the record's reason says why.
  EXEC_STATUS_NOT_STARTED = 1;
  // The command is running.
  EXEC_STATUS_STARTED = 2;
  // The command ended; the record carries its exit code or terminating
  // signal.
  EXEC_STATUS_EXITED = 3;
  // The agent ended while the command ran.
  EXEC_STATUS_CUT_SHORT = 4;
}

message ExecRecord {
  string exec_id = 1;
  ExecStatus status = 2;
  // Why the command did not start or was cut short.
  string reason = 3;
  // The exit code; meaningful when status is EXITED and term_signal is zero.
  int32 exit_code = 4;
  // The signal that ended the command; zero when it exited by itself.
  int32 term_signal = 5;
  // The agent keeps only the newest bytes of a command's output. This is the
  // offset of the earliest byte still held; a read after an earlier offset
  // fails with OUT_OF_RANGE and names it.
  uint64 earliest_offset = 6;
  // The guest's CLOCK_REALTIME when the agent reaped the command; set when
  // status is EXITED and unset otherwise.
  google.protobuf.Timestamp ended_at = 7;
}

message ExecRequest {
  // Chosen by the client.
  string exec_id = 1;
  // The program and its arguments; the first element is the program.
  repeated string argv = 2;
  // Environment variables. The command's environment is exactly these.
  map<string, string> env = 3;
  // Working directory; empty keeps the agent's.
  string working_dir = 4;
  // The user the command runs as, in the form and with the resolution of
  // RunConfig.user. Empty runs as root. A name that does not resolve is
  // NOT_FOUND and starts nothing.
  string user = 5;
}

message ExecResponse {
  ExecRecord record = 1;
}

message ReadExecOutputRequest {
  string exec_id = 1;
  // Resume after this byte offset of the output sequence; zero starts at
  // the beginning.
  uint64 after_offset = 2;
  // When non-zero, start this many bytes before the end of the output held
  // when the call arrives, or at the earliest byte held if fewer are held.
  // The stream then follows as usual. Setting it with a non-zero
  // after_offset is INVALID_ARGUMENT.
  uint64 tail_bytes = 3;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

// A run of bytes of one stream. Stdout and stderr share one sequence in
// the order the agent received them; offset is the position of the chunk's
// first byte in it.
message OutputChunk {
  OutputStream stream = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message ReadExecOutputResponse {
  oneof part {
    OutputChunk chunk = 1;
    // Last message of the stream.
    ExecRecord record = 2;
  }
}

message SignalRequest {
  string exec_id = 1;
  // A signal number, as on Linux.
  int32 signal = 2;
}

message SignalResponse {}

message ReadFileRequest {
  // An absolute path.
  string path = 1;
}

message ReadFileResponse {
  bytes chunk = 1;
}

message WriteFileStart {
  // An absolute path.
  string path = 1;
}

message WriteFileEnd {
  // The digest of the whole content sent, as "sha256:" and 64 lowercase
  // hexadecimal digits.
  string digest = 1;
}

message WriteFileRequest {
  oneof part {
    WriteFileStart start = 1;
    bytes chunk = 2;
    WriteFileEnd end = 3;
  }
}

message WriteFileResponse {}

message PatchFileRequest {
  // An absolute path.
  string path = 1;
  // Digests as "sha256:" and 64 lowercase hexadecimal digits.
  string base_digest = 2;
  string expected_digest = 3;
  // A unified diff.
  bytes patch = 4;
}

enum PatchOutcome {
  PATCH_OUTCOME_UNSPECIFIED = 0;
  // The file was at the base digest and now has the patch applied.
  PATCH_OUTCOME_APPLIED = 1;
  // The file was already at the expected digest; nothing changed.
  PATCH_OUTCOME_ALREADY_APPLIED = 2;
}

message PatchFileResponse {
  PatchOutcome outcome = 1;
}

message ListFilesRequest {
  // An absolute directory path.
  string path = 1;
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_FILE = 1;
  ENTRY_KIND_DIRECTORY = 2;
  ENTRY_KIND_SYMLINK = 3;
  ENTRY_KIND_OTHER = 4;
}

message FileEntry {
  // The absolute path of the entry.
  string path = 1;
  EntryKind kind = 2;
  // Size in bytes.
  uint64 size = 3;
}

message ListFilesResponse {
  // A run of the directory's entries.
  repeated FileEntry entries = 1;
}

message SearchFilesRequest {
  // An absolute directory path; the search covers its tree.
  string path = 1;
  // A glob matched against an entry's path relative to the directory. "*"
  // and "?" do not cross "/", "**" does, and "{a,b}" and "[ab]" are
  // supported.
  string pattern = 2;
}

message SearchFilesResponse {
  // A run of the matches.
  repeated FileEntry matches = 1;
}

message TerminateRequest {}

message TerminateResponse {}

message FindDiskRequest {
  // The ID mvmd attached the disk under.
  string disk_id = 1;
  // Where to mount the device's ext4 filesystem in the booted root; empty
  // mounts nothing. The path is absolute and clean, not "/", and not under
  // /proc, /sys, /dev or /run/mvmd, or the call is INVALID_ARGUMENT. The
  // agent creates the directory (0755, root) and mounts with nodev and
  // nosuid.
  string mount_path = 2;
  // Whether the attachment is read-only, and so the mount. Ignored without a
  // mount_path.
  bool read_only = 3;
}

message FindDiskResponse {
  // The block device's name, for example vdb; its node is /dev/<device>.
  string device = 1;
  // The device's size in bytes.
  uint64 size_bytes = 2;
  // Whether the device is read-only.
  bool read_only = 3;
}

message ReleaseDiskRequest {
  // The ID mvmd attached the disk under.
  string disk_id = 1;
}

message ReleaseDiskResponse {}

message GrowDiskRequest {
  // The ID mvmd attached the disk under.
  string disk_id = 1;
}

message GrowDiskResponse {
  // The device's size in bytes, as the kernel reports it after the call.
  uint64 size_bytes = 1;
}

message OnlineVcpusRequest {
  // The number of online vCPUs wanted, at least 1.
  uint32 vcpus = 1;
}

message OnlineVcpusResponse {
  // The number of online vCPUs, as the kernel reports them after the writes.
  uint32 vcpus = 1;
  // The memory the kernel reports as its total (MemTotal), in bytes.
  uint64 memory_bytes = 2;
}

message HealthRequest {}

message HealthResponse {}

message InfoRequest {}

message InfoResponse {
  // The agent's version.
  string agent_version = 1;
  // The contract versions the agent serves, for example "v1alpha1".
  repeated string api_versions = 2;
}

// Status details. An error a client must act on carries one of these messages
// in the details of its gRPC status (a google.rpc.Status in the
// grpc-status-details-bin trailer, each detail packed as an Any). A client
// branches on the detail's type and fields and never on the status message,
// which is for people and may change. A status that carries none of them is
// an error the client cannot act on beyond its code.

// A step of the boot, in the order the agent takes them.
enum BootStep {
  BOOT_STEP_UNSPECIFIED = 0;
  // Finding the image and the root disk by filesystem UUID.
  BOOT_STEP_CHECK = 1;
  BOOT_STEP_MOUNT_IMAGE = 2;
  BOOT_STEP_MOUNT_ROOT_DISK = 3;
  BOOT_STEP_OVERLAY = 4;
  BOOT_STEP_SWITCH_ROOT = 5;
  BOOT_STEP_NETWORK = 6;
  BOOT_STEP_ENTRYPOINT = 7;
  // Setting the wall clock from the Boot request's host_unix_nanos. It is the
  // first step the agent takes, though its number is the last assigned.
  BOOT_STEP_CLOCK = 8;
  // Placing RunConfig.files, after the network and before the user is
  // resolved, so a placed /etc/passwd or /etc/group is the one names resolve
  // against.
  BOOT_STEP_PLACE_FILES = 9;
  // Resolving RunConfig.user in the booted root.
  BOOT_STEP_APPLY_USER = 10;
  // Mounting the disks FindDisk recorded with a mount_path, after the files
  // are placed and before the user is resolved.
  BOOT_STEP_MOUNT_DISKS = 11;
}

// The detail of an OUT_OF_RANGE status from ReadExecOutput: the read starts
// before the output the agent still holds.
message ExecOutputGone {
  // The offset of the earliest byte still held; a read resumes from it.
  uint64 earliest_offset = 1;
}

// The detail of an INTERNAL status from a call whose boot step failed: Boot,
// and UpdateNetwork when its network step fails.
message BootFailed {
  BootStep step = 1;
  // Why the step failed, as text for people.
  string detail = 2;
}

// The detail of an INVALID_ARGUMENT status from a file call whose path names a
// file of the wrong kind.
message WrongFileKind {
  string path = 1;
  // The kind the call needs: FILE for read, write and patch, DIRECTORY for
  // list and search.
  EntryKind expected = 2;
}

enum BootState {
  BOOT_STATE_UNSPECIFIED = 0;
  // Boot has not been called, or its steps are still running.
  BOOT_STATE_PENDING = 1;
  // A boot step failed; the guest stays as it is until mvmd stops the Machine.
  BOOT_STATE_FAILED = 2;
}

// The detail of a FAILED_PRECONDITION status from a call refused because Boot
// has not succeeded.
message NotBooted {
  BootState state = 1;
}

// The detail of a FAILED_PRECONDITION status from ReleaseDisk: the kernel has
// the device, or a partition of it, claimed, as a mounted filesystem does, or
// a filesystem the agent mounted for it is busy.
message DiskInUse {
  // The disk_id the call named.
  string disk_id = 1;
}
